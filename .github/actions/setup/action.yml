name: Setup
description: Install mise + tools, restore yarn and Nx caches, install dependencies

runs:
  using: composite
  steps:
    # mise binary + installed tools (node, yarn)
    - name: Cache mise
      uses: actions/cache@v6
      with:
        path: |
          ~/.local/bin/mise
          ~/.local/share/mise
        key: mise-${{ runner.os }}-${{ hashFiles('mise.toml') }}

    - name: Install mise
      shell: bash
      run: |
        if [[ ! -x "$HOME/.local/bin/mise" ]]; then
          curl -fsSL https://mise.run | sh
        else
          echo "mise restored from cache"
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

    - name: Install tools (node, yarn)
      shell: bash
      run: |
        mise --version
        mise trust
        mise install
        mise ls

    # Yarn package cache: changes only when yarn.lock changes
    - name: Cache yarn
      uses: actions/cache@v6
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-

    # Nx local task cache: saved every run, restored from the latest one
    - name: Cache Nx
      uses: actions/cache@v6
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
          nx-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: mise run init
