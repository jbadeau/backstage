name: CI

# Protected branches (e.g. main): full release (version, changelog, tag, GitHub release, image + latest)
# Other branches:                 prerelease image only (e.g. 1.3.0-feat-login.42.0), no commit/tag

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

env:
  NX_NO_CLOUD: true
  # Nx 24 defaults to ~/.nx/<hash>/cache; keep it in the workspace so actions/cache can save it
  NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
  IMAGE_NAME: ghcr.io/jbadeau/backstage
  # Docker layer cache stored in the registry, shared by all branches
  DOCKER_BUILD_ARGS: >-
    --load
    --cache-from type=registry,ref=ghcr.io/jbadeau/backstage:buildcache
    --cache-to type=registry,ref=ghcr.io/jbadeau/backstage:buildcache,mode=max

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint, type-check and test
        run: |
          mise exec -- yarn lint:all
          mise exec -- yarn tsc
          mise exec -- yarn test

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: mise run build

  publish:
    name: ${{ github.ref_protected && 'Release' || 'Prerelease' }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH_NAME: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      # Read-only: version bumps change every package.json, so don't overwrite the shared cache
      DOCKER_BUILD_ARGS: >-
        --load
        --cache-from type=registry,ref=ghcr.io/jbadeau/backstage:buildcache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release (version, changelog, tag, GitHub release)
        id: release
        if: ${{ github.ref_protected }}
        run: |
          before="$(node -p "require('./packages/backend/package.json').version")"
          mise exec -- yarn nx release --skip-publish
          after="$(node -p "require('./packages/backend/package.json').version")"
          if [[ "$after" != "$before" ]]; then
            echo "Released $after"
            echo "version=$after" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable conventional commits; nothing to publish"
          fi

      - name: Prerelease version (no commit/tag)
        id: prerelease
        if: ${{ !github.ref_protected }}
        run: |
          before="$(node -p "require('./packages/backend/package.json').version")"
          slug="$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
          mise exec -- yarn nx release version --preid "${slug}.${BUILD_NUMBER}" \
            --git-commit=false --git-tag=false --git-push=false --stage-changes=false
          after="$(node -p "require('./packages/backend/package.json').version")"
          if [[ "$after" != "$before" ]]; then
            echo "Prerelease $after"
            echo "version=$after" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable conventional commits; nothing to publish"
          fi

      - name: Push image ${{ steps.release.outputs.version || steps.prerelease.outputs.version }}
        if: ${{ steps.release.outputs.version || steps.prerelease.outputs.version }}
        run: mise exec -- yarn push-image
