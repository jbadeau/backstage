name: CI

# Releasing is plain `nx release` (config in nx.json, Docker via @nx/docker):
#   Protected branches (e.g. main): nx release -> version, CHANGELOG.md, tag vX.Y.Z, GitHub release, image X.Y.Z
#   Other branches:                 nx release version --preid + publish -> image only (e.g. 0.2.0-feat-login.42.0)

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

env:
  NX_NO_CLOUD: true
  # Nx 24 defaults to ~/.nx/<hash>/cache; keep it in the workspace so actions/cache can save it
  NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # docker layer cache in ghcr
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint, format check, type-check and test
        run: |
          mise exec -- yarn lint:all
          mise exec -- yarn prettier:check
          mise exec -- yarn tsc
          mise exec -- yarn test

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (all projects + docker image)
        run: mise exec -- yarn nx run backend:docker:build --configuration=ci

  publish:
    name: ${{ github.ref_protected && 'Release' || 'Prerelease' }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: ${{ github.ref_protected }}
        run: mise exec -- yarn nx release --yes

      - name: Prerelease
        if: ${{ !github.ref_protected }}
        env:
          PREID: ${{ github.ref_name }}.${{ github.run_number }}
        run: |
          preid="$(echo "$PREID" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.]+/-/g; s/^-+|-+$//g')"
          mise exec -- yarn nx release version --preid "$preid" --git-commit=false --git-tag=false --stage-changes=false
          # `nx release version` leaves the version unchanged when no conventional commit calls for a bump
          version="$(node -p "require('./packages/backend/package.json').version")"
          if [[ "$version" == *-* ]]; then
            mise exec -- yarn nx release publish
          else
            echo "No releasable conventional commits; nothing to publish"
          fi
